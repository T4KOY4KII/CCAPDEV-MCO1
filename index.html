    <!--Hero section-->
    <div class="container-fluid hero">
        <div class="formcontainer">
            <div class="row">
                <h1 class="fs-50">Every great adventure starts with a buddy.</h1>
                <p class="fs-5">With <strong>TravelBuddy</strong>, you travel happy.</p>
            </div>
        </div>
    </div>

    <!--Quick flight search widget-->
    <div class="container">

        <div class="search-widget">

            <!-- Trip type, cabin class, and passenger-->
            <div class="row g-3 mb-3">

                <!--Trip type radio button-->
                <div class="col-12 col-md-auto d-flex flex-column">
                    <label class="search-field-label">Trip Type</label>

                    <div class="d-flex gap-3">

                        <div class="form-check mt-0 mb-0">
                            <input class="form-check-input" type="radio" name="tripType" id="oneWay" value="oneway"
                                checked />
                            <label class="form-check-label" for="oneWay">One-way</label>
                        </div>

                        <div class="form-check mt-0 mb-0">
                            <input class="form-check-input" type="radio" name="tripType" id="roundTrip" value="round" />
                            <label class="form-check-label" for="roundTrip">Round-trip</label>
                        </div>

                    </div>

                </div>

                <!--Cabin class dropdown-->
                <div class="col-6 col-md-auto">
                    <label class="search-field-label" for="cabinClass">Cabin Class</label>

                    <select class="form-select form-select-sm w-auto" id="cabinClass">
                        <option>Economy</option>
                        <option>Premium Economy</option>
                        <option>Business</option>
                        <option>First Class</option>
                    </select>

                </div>


                <!--Passenger selector dropdown-->
                <div class="col-6 col-md-auto">
                    <label class="search-field-label" for="passengers">Passengers</label>

                    <select class="form-select form-select-sm w-auto" id="passengers">
                        <option>Adults</option>
                        <option>Children</option>
                        <option>Infants</option>
                    </select>

                </div>

            </div>

            <!--Search fields (orgin+destination & departure+arrival)-->
            <div class="row g-2 align-items-end">

                <!--Origin picker-->
                <div class="col-12 col-md">
                    <label class="search-field-label" for="fromField">From</label>

                    <select class="form-select" id="fromField">
                        <option value="">Select origin</option>
                        <option>Manila (MNL)</option>
                        <option>Cebu (CEB)</option>
                    </select>

                </div>

                <!--Destination picker-->
                <div class="col-12 col-md">
                    <label class="search-field-label" for="toField">To</label>

                    <select class="form-select" id="toField">
                        <option value="">Select destination</option>
                        <option>Singapore (SIN)</option>
                        <option>Hong Kong (HKG))</option>
                    </select>

                </div>

                <!--Departure date picker-->
                <div class="col-12 col-md">
                    <label class="search-field-label" for="departDate">Depart</label>
                    <input type="date" class="form-control" id="departDate" />
                </div>

                <!--Return date picker-->
                <div class="col-12 col-md" id="returnDateWrap">
                    <label class="search-field-label" for="returnDate">Return</label>
                    <input type="date" class="form-control" id="returnDate" />
                </div>

                <!--Search button-->
                <div class="col-12 col-md-auto">
                    <button class="btn btn-primary w-100" id="searchBtn">
                        <i class="bi bi-search me-1"></i> Search Flights
                    </button>
                </div>

            </div>

        </div>

    </div>

    <!--Flight statistics-->
    <div class="container">

        <h2 class="text-start mt-5 mb-4">
            Flight Statistics
        </h2>

        <div class="row">

            <!--Available flights-->
            <div class="col-lg-4 col-md-6 mb-4">

                <div class="card h-100">
                    <div class="card-body">
                        <div class="card-title">
                            <h1 class="text-center mt-2">1</h1>

                        </div>

                        <div class="card-title">
                            <h5 class="text-center mb-2">Available flights</h5>

                        </div>
                    </div>

                </div>

            </div>

            <!--Active bookings-->
            <div class="col-lg-4 col-md-6 mb-4">

                <div class="card h-100">
                    <div class="card-body">
                        <div class="card-title">
                            <h1 class="text-center mt-2">1</h1>

                        </div>

                        <div class="card-title">
                            <h5 class="text-center mb-2">Active bookings</h5>
                        </div>
                    </div>

                </div>

            </div>


            <!--Popular destinations-->
            <div class="col-lg-4 col-md-6 mb-4">

                <div class="card h-100">
                    <div class="card-body">
                        <div class="card-title">
                            <h1 class="text-center mt-2">1</h1>

                        </div>

                        <div class="card-title">
                            <h5 class="text-center mb-2">Popular destinations</h5>

                        </div>
                    </div>

                </div>

            </div>



        </div>


    </div>
